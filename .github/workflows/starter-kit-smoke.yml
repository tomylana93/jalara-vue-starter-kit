name: Starter kit smoke test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: starter-kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh-install:
    name: Fresh installation
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Laravel installer
        run: |
          composer global require laravel/installer --no-interaction --prefer-dist --no-progress
          echo "$HOME/.config/composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Create application from pull request branch
        working-directory: /tmp
        run: |
          "$HOME/.config/composer/vendor/bin/laravel" new jalara-smoke \
            --using=https://github.com/${{ github.repository }}#${{ github.head_ref }} \
            --pnpm \
            --no-boost \
            --no-interaction

      - name: Verify generated application
        working-directory: /tmp/jalara-smoke
        run: |
          php artisan about --only=environment
          php artisan test
          pnpm run build
