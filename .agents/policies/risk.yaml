version: 1

factors:
  ambiguity:
    clear: 0
    details_missing: 1
    domain_decision_missing: 2
  blast_radius:
    local: 0
    feature_area: 1
    cross_module: 2
  data_schema:
    none: 0
    additive: 1
    destructive_or_backfill: 2
  security_auth:
    unrelated: 0
    ordinary_authorization: 1
    security_boundary: 2
  behavior:
    mechanical: 0
    local_behavior: 1
    public_contract: 2
  reversibility:
    easy: 0
    coordinated_revert: 1
    difficult: 2

mode_thresholds:
  express:
    minimum: 0
    maximum: 2
  standard:
    minimum: 3
    maximum: 6
  critical:
    minimum: 7
    maximum: 12

critical_overrides:
  - destructive_migration
  - authentication_boundary
  - authorization_model_change
  - concurrency_or_race_condition
  - public_api_contract
  - cross_module_architecture
  - production_release_workflow
