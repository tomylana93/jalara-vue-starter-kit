version: 1

routes:
  code_navigation:
    primary: serena
    fallback: repository_search
  laravel_documentation:
    primary: laravel_boost.search_docs
    fallback: context7
  database_structure:
    primary: laravel_boost.database_schema
    fallback: migration_files
  database_read_only_inspection:
    primary: laravel_boost.database_query
  runtime_browser_errors:
    primary: laravel_boost.browser_logs
    fallback: application_logs
  ui_component_registry:
    primary: shadcn
    fallback: existing_component_search
  external_library_documentation:
    primary: context7
    fallback: official_documentation
  issue_and_pull_request:
    primary: github

rules:
  - inspect_existing_code_before_external_research
  - use_laravel_boost_before_context7_for_laravel_ecosystem
  - use_serena_before_broad_file_reads_for_symbol_navigation
  - inspect_existing_components_before_generating_new_ui_components
  - database_queries_must_be_read_only_during_discovery
  - secrets_must_not_enter_task_packets_or_handoffs
  - write_capable_tools_follow_approval_policy
